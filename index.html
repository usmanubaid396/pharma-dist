<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharma-Dist Management System (PDMS)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <div id="app" class="flex-1 flex flex-col">
        
        <!-- ==================== AUTH VIEW ==================== -->
        <div id="auth-view" class="flex-1 flex items-center justify-center bg-gradient-to-br from-blue-900 via-indigo-900 to-slate-900 p-4">
            <div class="max-w-md w-full bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-8 border border-white/20">
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-brand-600 text-white rounded-2xl shadow-lg mb-4 text-2xl font-bold">
                        <i class="fa-solid fa-pills"></i>
                    </div>
                    <h1 class="text-2xl font-black text-slate-900 tracking-tight">Pharma-Dist PDMS</h1>
                    <p class="text-sm text-slate-500 mt-1">Advanced Pharmaceutical Distribution & Sales Hub</p>
                </div>

                <form id="login-form" class="space-y-5" onsubmit="handleLogin(event)">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Select Role / User</label>
                        <select id="login-role" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:outline-none bg-white text-slate-700 font-medium text-sm">
                            <option value="admin">Super Admin (Full System Control)</option>
                            <option value="regional-manager">Regional Manager (North Zone)</option>
                            <option value="sales-manager">Sales Manager (Punjab Region)</option>
                            <option value="booker">Order Booker (Field Agent)</option>
                            <option value="med-rep">Medical Representative (MR)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Email Address</label>
                        <input type="email" id="login-email" value="admin@pharmadist.com" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Password</label>
                        <input type="password" id="login-password" value="password123" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm">
                    </div>

                    <button type="submit" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow-lg shadow-brand-500/30 transition-all flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
                    </button>
                </form>

                <div class="mt-6 pt-6 border-t border-slate-200 text-center">
                    <p class="text-xs text-slate-500">Demo Mode: Select any role above and click Sign In instantly.</p>
                </div>
            </div>
        </div>

        <!-- ==================== DASHBOARD VIEW ==================== -->
        <div id="dashboard-view" class="hidden flex-1 flex flex-col h-screen overflow-hidden">
            
            <!-- Top Navbar -->
            <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 z-20 shrink-0">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()" class="text-slate-500 hover:text-slate-700 md:hidden">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-brand-600 text-white rounded-xl flex items-center justify-center font-bold">
                            <i class="fa-solid fa-pills"></i>
                        </div>
                        <div>
                            <span class="font-bold text-slate-900 text-base">Pharma-Dist</span>
                            <span id="role-badge" class="ml-2 text-xs px-2 py-0.5 bg-brand-100 text-brand-800 rounded-full font-semibold uppercase">Admin</span>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <div class="relative hidden sm:block">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-magnifying-glass text-xs"></i>
                        </span>
                        <input type="text" placeholder="Global search medicines, orders..." class="pl-9 pr-4 py-2 bg-slate-100 rounded-xl text-xs w-64 focus:outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                    
                    <button onclick="triggerNotification('New sales order #SO-9024 received from City Pharmacy')" class="relative text-slate-500 hover:text-slate-700 p-2">
                        <i class="fa-regular fa-bell text-lg"></i>
                        <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
                    </button>

                    <div class="h-6 w-px bg-slate-200"></div>

                    <div class="flex items-center gap-3">
                        <div class="text-right hidden sm:block">
                            <div id="user-name-display" class="text-xs font-bold text-slate-800">Dr. Arslan Ahmed</div>
                            <div id="user-region-display" class="text-[10px] text-slate-500">Headquarters - Lahore</div>
                        </div>
                        <button onclick="handleLogout()" class="w-9 h-9 bg-red-50 text-red-600 hover:bg-red-100 rounded-xl flex items-center justify-center transition-colors" title="Logout">
                            <i class="fa-solid fa-power-off text-sm"></i>
                        </button>
                    </div>
                </div>
            </header>

            <div class="flex-1 flex overflow-hidden">
                
                <!-- Sidebar Navigation -->
                <aside id="sidebar" class="w-64 bg-slate-900 text-slate-300 flex flex-col shrink-0 transition-all duration-300 z-10">
                    <div class="p-4 text-xs font-bold uppercase tracking-wider text-slate-500">Navigation</div>
                    <nav id="sidebar-nav" class="flex-1 px-3 space-y-1 overflow-y-auto">
                        <!-- Dynamically populated based on role -->
                    </nav>
                    <div class="p-4 border-t border-slate-800 text-xs text-slate-500 flex items-center justify-between">
                        <span>PDMS v2.4.0</span>
                        <span class="text-emerald-400 font-bold"><i class="fa-solid fa-circle text-[8px] mr-1"></i> Live API</span>
                    </div>
                </aside>

                <!-- Main Content Workspace -->
                <main id="main-content" class="flex-1 bg-slate-50 overflow-y-auto p-6">
                    <!-- Dynamic views injected here -->
                </main>
            </div>
        </div>

    </div>

    <script>
        // --- GLOBAL STATE & MOCK DATABASE ---
        let currentUser = null;
        let activeTab = 'dashboard';

        const mockDB = {
            medicines: [
                { id: 'M001', name: 'Augmentin 625mg', category: 'Antibiotic', stock: 1250, price: 450, batch: 'AUG-882', expiry: '2027-05-12' },
                { id: 'M002', name: 'Panadol Extra 500mg', category: 'Analgesic', stock: 5400, price: 35, batch: 'PAN-104', expiry: '2028-01-20' },
                { id: 'M003', name: 'Glucophage 850mg', category: 'Antidiabetic', stock: 890, price: 210, batch: 'GLU-443', expiry: '2026-11-15' },
                { id: 'M004', name: 'Brufen 400mg', category: 'Anti-inflammatory', stock: 3200, price: 80, batch: 'BRU-902', expiry: '2027-08-10' },
                { id: 'M005', name: 'Velosef 500mg', category: 'Antibiotic', stock: 450, price: 620, batch: 'VEL-332', expiry: '2026-09-30' },
                { id: 'M006', name: 'Risek 40mg Capsule', category: 'Gastrointestinal', stock: 2100, price: 340, batch: 'RSK-771', expiry: '2027-12-05' }
            ],
            orders: [
                { id: 'ORD-501', client: 'City Medical Store', booker: 'Ali Khan', region: 'Lahore Central', total: 45200, status: 'Approved', date: '2026-06-08' },
                { id: 'ORD-502', client: 'Al-Shifa Pharmacy', booker: 'Usman Tariq', region: 'Faisalabad North', total: 18900, status: 'Pending', date: '2026-06-09' },
                { id: 'ORD-503', client: 'MediCare Plus', booker: 'Ali Khan', region: 'Lahore Central', total: 84000, status: 'Dispatched', date: '2026-06-07' },
                { id: 'ORD-504', client: 'Care & Cure Chemist', booker: 'Bilal Ahmed', region: 'Multan Cantt', total: 32500, status: 'Delivered', date: '2026-06-06' }
            ],
            fieldStaff: [
                { id: 'EMP-101', name: 'Ali Khan', role: 'Order Booker', region: 'Lahore Central', target: 1500000, achieved: 1250000, status: 'Active' },
                { id: 'EMP-102', name: 'Usman Tariq', role: 'Order Booker', region: 'Faisalabad North', target: 1200000, achieved: 980000, status: 'Active' },
                { id: 'EMP-103', name: 'Dr. Kamran Akmal', role: 'Medical Representative', region: 'Lahore South', target: 2000000, achieved: 1850000, status: 'Active' },
                { id: 'EMP-104', name: 'Bilal Ahmed', role: 'Order Booker', region: 'Multan Cantt', target: 1000000, achieved: 1120000, status: 'On Leave' }
            ],
            clients: [
                { id: 'CLI-01', name: 'City Medical Store', type: 'Pharmacy', city: 'Lahore', creditLimit: 200000, balance: 45000 },
                { id: 'CLI-02', name: 'Al-Shifa Pharmacy', type: 'Medical Store', city: 'Faisalabad', creditLimit: 150000, balance: 18900 },
                { id: 'CLI-03', name: 'MediCare Plus', type: 'Distributor', city: 'Lahore', creditLimit: 500000, balance: 120000 },
                { id: 'CLI-04', name: 'Care & Cure Chemist', type: 'Pharmacy', city: 'Multan', creditLimit: 100000, balance: 0 }
            ]
        };

        // --- AUTHENTICATION CONTROLLER ---
        function handleLogin(event) {
            event.preventDefault();
            const role = document.getElementById('login-role').value;
            const email = document.getElementById('login-email').value;
            
            const roleNames = {
                'admin': { name: 'Super Admin', title: 'System Administrator' },
                'regional-manager': { name: 'Hamza Malik', title: 'Regional Manager (North)' },
                'sales-manager': { name: 'Tariq Jamil', title: 'Sales Manager (Punjab)' },
                'booker': { name: 'Ali Khan', title: 'Field Order Booker' },
                'med-rep': { name: 'Dr. Kamran Akmal', title: 'Medical Representative' }
            };

            currentUser = {
                role: role,
                email: email,
                name: roleNames[role].name,
                title: roleNames[role].title
            };

            document.getElementById('role-badge').innerText = role.replace('-', ' ');
            document.getElementById('user-name-display').innerText = currentUser.name;
            document.getElementById('user-region-display').innerText = currentUser.title;

            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');

            renderSidebar();
            navigateTo('dashboard');
        }

        function handleLogout() {
            currentUser = null;
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('auth-view').classList.remove('hidden');
        }

        // --- SIDEBAR & NAVIGATION BUILDER ---
        const roleMenus = {
            'admin': [
                { id: 'dashboard', label: 'Executive Dashboard', icon: 'fa-chart-pie' },
                { id: 'inventory', label: 'Inventory & Stock', icon: 'fa-boxes-stacked' },
                { id: 'orders', label: 'All Orders', icon: 'fa-file-invoice-dollar' },
                { id: 'field-team', label: 'Field Staff & Targets', icon: 'fa-users-gear' },
                { id: 'clients', label: 'Pharma Clients', icon: 'fa-hospital' },
                { id: 'reports', label: 'Financial Reports', icon: 'fa-chart-line' },
                { id: 'settings', label: 'System Settings', icon: 'fa-gear' }
            ],
            'regional-manager': [
                { id: 'dashboard', label: 'Regional Overview', icon: 'fa-chart-pie' },
                { id: 'orders', label: 'Zone Orders', icon: 'fa-file-invoice-dollar' },
                { id: 'field-team', label: 'Sales Force Tracking', icon: 'fa-users' },
                { id: 'inventory', label: 'Stock Availability', icon: 'fa-boxes-stacked' }
            ],
            'sales-manager': [
                { id: 'dashboard', label: 'Sales Dashboard', icon: 'fa-chart-pie' },
                { id: 'orders', label: 'Order Approvals', icon: 'fa-check-to-slot' },
                { id: 'booker', label: 'Booker Management', icon: 'fa-user-tie' },
                { id: 'inventory', label: 'Product Catalog', icon: 'fa-pills' }
            ],
            'booker': [
                { id: 'dashboard', label: 'Booker Portal', icon: 'fa-house' },
                { id: 'new-order', label: 'Book New Order', icon: 'fa-cart-plus' },
                { id: 'orders', label: 'My Booked Orders', icon: 'fa-receipt' },
                { id: 'clients', label: 'Client Ledger', icon: 'fa-address-book' }
            ],
            'med-rep': [
                { id: 'dashboard', label: 'MR Activity Hub', icon: 'fa-stethoscope' },
                { id: 'inventory', label: 'Sample Catalog', icon: 'fa-pills' },
                { id: 'reports', label: 'Doctor Visits & Logs', icon: 'fa-clipboard-user' }
            ]
        };

        function renderSidebar() {
            const navContainer = document.getElementById('sidebar-nav');
            const menus = roleMenus[currentUser.role] || roleMenus['admin'];
            
            navContainer.innerHTML = menus.map(m => `
                <button onclick="navigateTo('${m.id}')" id="nav-${m.id}" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${activeTab === m.id ? 'bg-brand-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}">
                    <i class="fa-solid ${m.icon} w-5 text-center"></i>
                    <span>${m.label}</span>
                </button>
            `).join('');
        }

        function navigateTo(tabId) {
            activeTab = tabId;
            renderSidebar();
            
            const main = document.getElementById('main-content');
            
            // Render corresponding view
            if (tabId === 'dashboard') renderDashboardView(main);
            else if (tabId === 'inventory') renderInventoryView(main);
            else if (tabId === 'orders') renderOrdersView(main);
            else if (tabId === 'field-team') renderFieldTeamView(main);
            else if (tabId === 'clients') renderClientsView(main);
            else if (tabId === 'new-order') renderNewOrderView(main);
            else if (tabId === 'reports') renderReportsView(main);
            else if (tabId === 'settings') renderSettingsView(main);
            else renderDashboardView(main);
        }

        // --- STREAMING_CHUNK:Rendering Dashboard View ---
        function renderDashboardView(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                        <div>
                            <h1 class="text-xl font-black text-slate-900">Dashboard Overview</h1>
                            <p class="text-xs text-slate-500">Welcome back, ${currentUser.name} (${currentUser.title})</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="triggerNotification('Data export generated successfully!')" class="px-4 py-2 bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 rounded-xl text-xs font-bold shadow-sm transition-all">
                                <i class="fa-solid fa-download mr-1.5 text-brand-600"></i> Export Report
                            </button>
                            ${currentUser.role === 'booker' ? `
                                <button onclick="navigateTo('new-order')" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold shadow-lg shadow-brand-500/30 transition-all">
                                    <i class="fa-solid fa-plus mr-1.5"></i> New Order
                                </button>
                            ` : ''}
                        </div>
                    </div>

                    <!-- Metrics Grid -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Total Revenue (MTD)</p>
                                <h3 class="text-2xl font-black text-slate-900 mt-1">PKR 4.82M</h3>
                                <span class="text-emerald-600 text-xs font-bold mt-1 inline-flex items-center"><i class="fa-solid fa-arrow-trend-up mr-1"></i> +12.4% vs last month</span>
                            </div>
                            <div class="w-12 h-12 bg-blue-50 text-brand-600 rounded-2xl flex items-center justify-center text-xl">
                                <i class="fa-solid fa-wallet"></i>
                            </div>
                        </div>

                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Orders Booked</p>
                                <h3 class="text-2xl font-black text-slate-900 mt-1">342</h3>
                                <span class="text-emerald-600 text-xs font-bold mt-1 inline-flex items-center"><i class="fa-solid fa-arrow-trend-up mr-1"></i> +8.2%</span>
                            </div>
                            <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-xl">
                                <i class="fa-solid fa-cart-shopping"></i>
                            </div>
                        </div>

                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Active Stock Items</p>
                                <h3 class="text-2xl font-black text-slate-900 mt-1">${mockDB.medicines.length} SKUs</h3>
                                <span class="text-amber-600 text-xs font-bold mt-1 inline-flex items-center"><i class="fa-solid fa-triangle-exclamation mr-1"></i> 2 Low Stock</span>
                            </div>
                            <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center text-xl">
                                <i class="fa-solid fa-boxes-stacked"></i>
                            </div>
                        </div>

                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Active Field Force</p>
                                <h3 class="text-2xl font-black text-slate-900 mt-1">24 Agents</h3>
                                <span class="text-blue-600 text-xs font-bold mt-1 inline-flex items-center"><i class="fa-solid fa-location-dot mr-1"></i> 4 Regions</span>
                            </div>
                            <div class="w-12 h-12 bg-purple-50 text-purple-600 rounded-2xl flex items-center justify-center text-xl">
                                <i class="fa-solid fa-user-group"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Charts & Recent Activity Section -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm lg:col-span-2">
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="font-bold text-slate-800 text-sm">Monthly Regional Sales Performance (PKR)</h3>
                                <span class="text-xs text-slate-400">Updated Today</span>
                            </div>
                            <div class="h-64 flex items-center justify-center bg-slate-50 rounded-xl relative">
                                <canvas id="salesChart"></canvas>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col">
                            <h3 class="font-bold text-slate-800 text-sm mb-4">Live Order Feed</h3>
                            <div class="space-y-3 flex-1 overflow-y-auto pr-1">
                                ${mockDB.orders.map(o => `
                                    <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 flex items-center justify-between text-xs">
                                        <div>
                                            <span class="font-bold text-slate-900">${o.client}</span>
                                            <div class="text-slate-500 mt-0.5">${o.booker} • ${o.region}</div>
                                        </div>
                                        <div class="text-right">
                                            <span class="font-bold text-brand-600">PKR ${o.total.toLocaleString()}</span>
                                            <div><span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${o.status === 'Approved' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${o.status}</span></div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Initialize Chart.js
            setTimeout(() => {
                const ctx = document.getElementById('salesChart');
                if (ctx) {
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: ['Lahore', 'Faisalabad', 'Multan', 'Islamabad', 'Peshawar', 'Karachi'],
                            datasets: [{
                                label: 'Sales (Millions PKR)',
                                data: [1.2, 0.9, 0.75, 1.1, 0.6, 1.4],
                                backgroundColor: '#3b82f6',
                                borderRadius: 8
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
                                x: { grid: { display: false } }
                            }
                        }
                    });
                }
            }, 100);
        }

        // --- STREAMING_CHUNK:Rendering Inventory & Stock View ---
        function renderInventoryView(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                        <div>
                            <h1 class="text-xl font-black text-slate-900">Pharmaceutical Inventory</h1>
                            <p class="text-xs text-slate-500">Manage medicine batches, pricing, and stock levels</p>
                        </div>
                        ${currentUser.role === 'admin' ? `
                            <button onclick="openAddMedicineModal()" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold shadow-lg shadow-brand-500/30 transition-all">
                                <i class="fa-solid fa-plus mr-1.5"></i> Add New Medicine
                            </button>
                        ` : ''}
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="p-4 border-b border-slate-200 flex items-center justify-between gap-4">
                            <input type="text" placeholder="Search medicines by name or category..." class="px-4 py-2 bg-slate-100 rounded-xl text-xs w-72 focus:outline-none focus:ring-2 focus:ring-brand-500" onkeyup="filterInventory(this.value)">
                            <div class="text-xs text-slate-500 font-medium">Showing ${mockDB.medicines.length} items in warehouse</div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-400 font-bold uppercase tracking-wider border-b border-slate-200">
                                        <th class="p-4">SKU & Name</th>
                                        <th class="p-4">Category</th>
                                        <th class="p-4">Batch No.</th>
                                        <th class="p-4">Expiry Date</th>
                                        <th class="p-4">Stock Units</th>
                                        <th class="p-4">Unit Price (PKR)</th>
                                        <th class="p-4 text-right">Actions</th>
                                    </tr>

        function submitNewOrder() {
            const client = document.getElementById('order-client').value;
            const inputs = document.querySelectorAll('.order-qty-input');
            let total = 0;
            let itemsCount = 0;

            inputs.forEach(input => {
                const qty = parseInt(input.value) || 0;
                if (qty > 0) {
                    total += qty * parseFloat(input.dataset.price);
                    itemsCount += qty;
                }
            });

            if (itemsCount === 0) {
                triggerNotification('Please select at least one medicine quantity to book order.', 'error');
                return;
            }

            const newOrd = {
                id: 'ORD-' + Math.floor(100 + Math.random() * 900),
                client: client,
                booker: currentUser.name,
                region: 'Lahore Central',
                total: total,
                status: 'Pending',
                date: new Date().toISOString().split('T')[0]
            };

            mockDB.orders.unshift(newOrd);
            triggerNotification(`Order ${newOrd.id} successfully booked for PKR ${total.toLocaleString()}`);
            navigateTo('orders');
        }

        // --- UTILITY NOTIFICATION TOAST ---
        function triggerNotification(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-6 right-6 z-50 px-5 py-3 rounded-2xl text-xs font-bold text-white shadow-2xl flex items-center gap-3 transition-all duration-300 transform translate-y-10 opacity-0 ${type === 'error' ? 'bg-red-600' : 'bg-slate-900 border border-slate-800'}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation text-red-200' : 'fa-circle-check text-emerald-400'} text-sm"></i> <span>${message}</span>`;
            document.body.appendChild(toast);
            
            setTimeout(() => { toast.classList.remove('translate-y-10', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }
